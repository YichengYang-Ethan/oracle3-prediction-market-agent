name: Pytest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Installed-wheel-MCP:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sdk: '1'
            mcp: 'mcp>=1.19,<2'
          - sdk: '2'
            mcp: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the actual distribution
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel and verify the real stdio transport outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/oracle3-wheel"
          wheel_python="$RUNNER_TEMP/oracle3-wheel/bin/python"
          "$wheel_python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl '${{ matrix.mcp }}'
          "$wheel_python" -m pip check
          cp scripts/check_installed_mcp.py "$RUNNER_TEMP/check_installed_mcp.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" check_installed_mcp.py --wheel "$GITHUB_WORKSPACE"/dist/*.whl > "$GITHUB_WORKSPACE/mcp-wheel.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-installed-wheel-sdk-${{ matrix.sdk }}
          path: mcp-wheel.json
          if-no-files-found: ignore

  Pytest:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3
          poetry install --all-extras
      - name: Test with pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOGETHERAI_API_KEY: ${{ secrets.TOGETHERAI_API_KEY }}
        run: |
          poetry run pytest --cov=oracle3 --cov-report=xml --cov-report=term-missing
      - name: Replay agent tool and recovery contracts
        run: poetry run python scripts/check_agent_contracts.py --output agent-contracts.json
      - name: Upload contract regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-contracts-locked-sdk
          path: agent-contracts.json
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  MCP-latest-SDK:
    # The locked environment pins mcp 1.x; fresh installs resolve the newest mcp.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oracle3 with the newest mcp SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e . "mcp>=2" pytest "pytest-asyncio<0.24" pytest-mock hypothesis
      - name: Test the MCP server, fee schedules and arbitrage checks
        run: |
          pytest -o addopts="" tests/test_mcp_server.py tests/test_fees.py tests/test_arbitrage.py
      - name: Replay agent contracts with the newest MCP SDK
        run: python scripts/check_agent_contracts.py --output agent-contracts.json
      - name: Upload contract regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-contracts-latest-sdk
          path: agent-contracts.json
          if-no-files-found: ignore
