name: Publish to PyPI

# Triggered when a GitHub Release is published.
# 1. Builds and publishes oracle3 to PyPI with Trusted Publishing (OIDC).
#    The PyPI trusted publisher must name this repository, this workflow
#    (pypi-publish.yml) and the "pypi" environment; if the repository is
#    renamed, update the publisher at https://pypi.org/manage/account/publishing/
# 2. Publishes server.json to the MCP Registry with GitHub OIDC, after the
#    package is visible on PyPI (the registry verifies the mcp-name marker in
#    the PyPI description).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish oracle3 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oracle3
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry>=1.9.0"

      - name: Verify version matches the tag
        run: |
          poetry_ver=$(poetry version -s)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "pyproject version: ${poetry_ver}"
          echo "release tag:       ${tag_ver}"
          if [ -n "${tag_ver}" ] && [ "${poetry_ver}" != "${tag_ver}" ]; then
            echo "::error::pyproject.toml version (${poetry_ver}) does not match release tag (${tag_ver})"
            exit 1
          fi

      - name: Build sdist and wheel
        run: poetry build

      - name: List built artifacts
        run: ls -la dist/

      - name: Verify installed wheel before publishing
        run: |
          python -m venv "$RUNNER_TEMP/oracle3-release-wheel"
          wheel_python="$RUNNER_TEMP/oracle3-release-wheel/bin/python"
          "$wheel_python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          "$wheel_python" -m pip check
          cp scripts/check_installed_mcp.py "$RUNNER_TEMP/check_installed_mcp.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" check_installed_mcp.py --wheel "$GITHUB_WORKSPACE"/dist/*.whl

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: Publish server.json to the MCP Registry
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry GitHub OIDC login
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check server.json matches pyproject.toml
        run: |
          server_ver=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          pkg_ver=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          pyproject_ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
          echo "server.json ${server_ver} / package ${pkg_ver} / pyproject ${pyproject_ver}"
          if [ "${server_ver}" != "${pyproject_ver}" ] || [ "${pkg_ver}" != "${pyproject_ver}" ]; then
            echo "::error::server.json versions must equal the pyproject version"
            exit 1
          fi
          echo "VERSION=${pyproject_ver}" >> "$GITHUB_ENV"

      - name: Wait for the release to appear on PyPI
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/oracle3/${VERSION}/json" > /dev/null; then
              echo "oracle3 ${VERSION} is on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "::error::oracle3 ${VERSION} did not appear on PyPI"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
