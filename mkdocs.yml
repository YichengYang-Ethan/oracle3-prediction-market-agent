site_name: Oracle3
site_description: Open-source trading engine and MCP server for prediction markets. Fee-aware no-arbitrage trading across related contracts, live on Kalshi, Polymarket and Solana or on paper.
site_url: https://yichengyang-ethan.github.io/oracle3-prediction-market-agent/
repo_url: https://github.com/YichengYang-Ethan/oracle3-prediction-market-agent
repo_name: YichengYang-Ethan/oracle3-prediction-market-agent
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - MCP server: mcp.md
  - oracle3-extras: extras.md
  - Research:
      - Do arbitrage edges survive fees?: research/fee-frontier.md
  - Getting Started:
      - Quick Start: CLI_QUICK_START.md
  - CLI Reference:
      - Monitoring: CLI_MONITORING.md
  - Architecture:
      - Solana Pre-flight Risk: architecture.md
      - Project Specification: PROJECT_SPECIFICATION.md
